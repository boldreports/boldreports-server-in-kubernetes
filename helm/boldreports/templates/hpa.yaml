{{- if .Values.autoscaling.enabled }}
{{- range $service := .Values.instanceConfig}}
{{- if ne (toString $service.hpaEnabled) "false" }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  labels:
    helm.sh/chart: {{ $.Chart.Name }}_{{ $.Chart.Version }}
    app.kubernetes.io/name: {{ $service.app }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    {{- if $.Chart.AppVersion }}
    app.kubernetes.io/version: {{ $.Chart.AppVersion | quote }}
    {{- end }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
  name: {{ $service.app }}-hpa
  {{- if eq $.Release.Namespace "default" }}
  namespace: {{ $.Values.namespace }}
  {{- else }}
  namespace: {{ $.Release.Namespace }}
  {{- end }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $service.app }}-deployment
  minReplicas: {{ $service.minReplicas }}
  maxReplicas: {{ $service.maxReplicas }}
  {{- /* Per-service targets override the global ones; 0 or null drops that metric for the service. */}}
  {{- $cpuTarget := ternary $service.targetCPUUtilizationPercentage $.Values.autoscaling.targetCPUUtilizationPercentage (hasKey $service "targetCPUUtilizationPercentage") }}
  {{- $memoryTarget := ternary $service.targetMemoryUtilizationPercentage $.Values.autoscaling.targetMemoryUtilizationPercentage (hasKey $service "targetMemoryUtilizationPercentage") }}
  {{- if not (or $cpuTarget $memoryTarget) }}
  {{- fail (printf "instanceConfig %s: the HPA needs a CPU or memory target; set hpaEnabled: false to run without one" $service.app) }}
  {{- end }}
  metrics:
  {{- if $cpuTarget }}
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ $cpuTarget }}
  {{- end }}
  {{- if $memoryTarget }}
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: {{ $memoryTarget }}
  {{- end }}
  {{- if ne $.Values.clusterProvider "aks" }}
  behavior:
    {{- with $.Values.autoscaling.behavior.scaleUp }}
    scaleUp:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    scaleDown:
      stabilizationWindowSeconds: {{ $.Values.autoscaling.behavior.stabilizationWindowSeconds }}
      policies:
      - type: Pods
        value: {{ $.Values.autoscaling.behavior.podsValue }}
        periodSeconds: {{ $.Values.autoscaling.behavior.podsPeriodSeconds }}
      - type: Percent
        value: {{ $.Values.autoscaling.behavior.percentValue }}
        periodSeconds: {{ $.Values.autoscaling.behavior.percentPeriodSeconds }}
  {{- end }}
---
{{- end }}
{{- end }}
{{- end }}
