{{- range $service := .Values.instanceConfig}}
{{- /* Define PV check ONCE here — reuse $hasRealPV everywhere */ -}}
{{- $hasRealPV := or
    $.Values.persistentVolume.useExistingClaim
    (and (eq $.Values.clusterProvider "onpremise")
         (ne (default "" $.Values.persistentVolume.onpremise.hostPath) ""))
    (and (eq $.Values.clusterProvider "aks")
         (or (ne (default "" $.Values.persistentVolume.aks.nfs.fileShareName) "")
             (ne (default "" $.Values.persistentVolume.aks.fileShareName) "")))
    (and (eq $.Values.clusterProvider "eks")
         (ne (default "" $.Values.persistentVolume.eks.efsFileSystemId) ""))
    (and (eq $.Values.clusterProvider "gke")
         (and (ne (default "" $.Values.persistentVolume.gke.fileShareIp) "")
              (ne (default "" $.Values.persistentVolume.gke.fileShareName) "")))
    (and (eq $.Values.clusterProvider "ack")
         (ne (default "" $.Values.persistentVolume.ack.serverName) ""))
    (and (eq $.Values.clusterProvider "oke")
         (or (ne (default "" $.Values.persistentVolume.oke.volumeHandle) "")
             (and $.Values.persistentVolume.oke.blockVolume.blockVolumeEnable
                  (ne (default "" $.Values.persistentVolume.oke.blockVolume.blockVolumeCapacity) ""))))
}}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    helm.sh/chart: {{ $.Chart.Name }}_{{ $.Chart.Version }}
    app.kubernetes.io/name: {{ $service.app }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    {{- if $.Chart.AppVersion }}
    app.kubernetes.io/version: {{ $.Chart.AppVersion | quote }}
    {{- end }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
  name: {{ $service.app }}-deployment
  {{- if eq $.Release.Namespace "default" }}
  namespace: {{ $.Values.namespace }}
  {{- else }}
  namespace: {{ $.Release.Namespace }}
  {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $service.app }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  {{- if or (not $.Values.autoscaling.enabled) (eq (toString $service.hpaEnabled) "false") }}
  replicas: {{ $service.replicaCount }}
  {{- end }}
  {{- $revisionHistoryLimit := ternary $service.revisionHistoryLimit $.Values.revisionHistoryLimit (hasKey $service "revisionHistoryLimit") }}
  {{- if not (kindIs "invalid" $revisionHistoryLimit) }}
  revisionHistoryLimit: {{ $revisionHistoryLimit }}
  {{- end }}
  {{- with ($service.strategy | default $.Values.strategy) }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $service.app }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        {{- /* The selector labels above can't be overridden: changing them would orphan the Deployment's pods. */}}
        {{- with (omit (merge (dict) ($service.podLabels | default dict) ($.Values.podLabels | default dict)) "app.kubernetes.io/name" "app.kubernetes.io/instance") }}
        {{- include "boldreports.stringMap" . | nindent 8 }}
        {{- end }}
      {{- $podAnnotations := merge (dict) ($service.podAnnotations | default dict) ($.Values.podAnnotations | default dict) }}
      {{- if $.Values.rollOnConfigChange }}
      {{- $_ := set $podAnnotations "checksum/log4net-config" (include (print $.Template.BasePath "/log4net_config.yaml") $ | sha256sum) }}
      {{- $_ := set $podAnnotations "checksum/branding-config" (include (print $.Template.BasePath "/branding_config.yaml") $ | sha256sum) }}
      {{- end }}
      {{- with $podAnnotations }}
      annotations:
        {{- include "boldreports.stringMap" . | nindent 8 }}
      {{- end }}
    spec:
      {{- with (include "boldreports.podServiceAccountName" $) }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- if and $.Values.serviceAccount (hasKey $.Values.serviceAccount "automountServiceAccountToken") }}
      {{- if not (kindIs "invalid" $.Values.serviceAccount.automountServiceAccountToken) }}
      automountServiceAccountToken: {{ $.Values.serviceAccount.automountServiceAccountToken }}
      {{- end }}
      {{- end }}
      {{- with ($service.podSecurityContext | default $.Values.podSecurityContext) }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with ($service.terminationGracePeriodSeconds | default $.Values.terminationGracePeriodSeconds) }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- with ($service.priorityClassName | default $.Values.priorityClassName) }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with (merge (dict) ($service.nodeSelector | default dict) ($.Values.nodeSelector | default dict)) }}
      nodeSelector:
        {{- include "boldreports.stringMap" . | nindent 8 }}
      {{- end }}
      {{- with ($service.topologySpreadConstraints | default $.Values.topologySpreadConstraints) }}
      {{- /* Every field is passed through (minDomains, matchLabelKeys, nodeAffinityPolicy, ...);
             maxSkew, topologyKey, whenUnsatisfiable and labelSelector get defaults when omitted. */}}
      {{- $constraints := list }}
      {{- range . }}
      {{- $c := merge (deepCopy .) (dict "maxSkew" 1 "topologyKey" "kubernetes.io/hostname" "whenUnsatisfiable" "ScheduleAnyway") }}
      {{- if not $c.labelSelector }}
      {{- $_ := set $c "labelSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" $service.app "app.kubernetes.io/instance" $.Release.Name)) }}
      {{- end }}
      {{- $constraints = append $constraints $c }}
      {{- end }}
      topologySpreadConstraints:
        {{- toYaml $constraints | nindent 8 }}
      {{- end }}
      {{- if ne $service.app "id-web" }}
      initContainers:
      - name: id-web-initialization
        {{- if and (hasKey $.Values "initContainersImage") (hasKey $.Values.initContainersImage "initContainersRepo") (hasKey $.Values.initContainersImage "initContainersTag") }}
        image: "{{ $.Values.initContainersImage.initContainersRepo }}:{{ $.Values.initContainersImage.initContainersTag }}"
        {{- else }}
        image: "busybox:1.28"
        {{- end }}
        command: ["/bin/sh","-c"]
        {{- if and $hasRealPV (not ($.Values.ociStorage.enabled | default false)) (not ($.Values.s3Storage.enabled | default false)) (not ($.Values.azureStorage.enabled | default false)) }}
        args: ["while [ ! -f /application/app_data/configuration/config.json ] || [ ! -f /application/app_data/configuration/privatekeys.dat ]; do echo 'Waiting for required files...'; sleep 10; done; echo 'Both config.json and privatekeys.dat files exist.'"]
        {{- else }}
        args: ["echo 'Waiting for id-web service...'; while ! nc -z id-web-service 6000; do echo 'Still waiting...'; sleep 10; done; echo 'id-web is ready'"]
        {{- end }}
        {{- with ($service.containerSecurityContext | default $.Values.containerSecurityContext) }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $.Values.initContainerResources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if $hasRealPV }}
        volumeMounts:
        - mountPath: /application/app_data
          name: {{ $service.app }}-volume
        {{- end }}
      {{- end }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
      {{- if kindIs "string" . }}
      - name: {{ . }}
      {{- else }}
      {{- range . }}
      - name: {{ if kindIs "map" . }}{{ .name }}{{ else }}{{ . }}{{ end }}
      {{- end }}
      {{- end }}
      {{- end }}
      containers:
      - name: {{ $service.app }}-container
        {{- if eq $service.app "id-web" }}
        image: "{{ $.Values.image.idRepo }}/bold-identity:{{ $.Values.image.idTag }}"
        {{- else if eq $service.app "id-api" }}
        image: "{{ $.Values.image.idRepo }}/bold-idp-api:{{ $.Values.image.idTag }}"
        {{- else if eq $service.app "id-ums" }}
        image: "{{ $.Values.image.idRepo }}/bold-ums:{{ $.Values.image.idTag }}"
        {{- else if eq $service.app "reports-web" }}
        image: "{{ $.Values.image.reportsRepo }}/boldreports-server:{{ $.Values.image.reportsTag }}"
        {{- else if eq $service.app "reports-api" }}
        image: "{{ $.Values.image.reportsRepo }}/boldreports-server-api:{{ $.Values.image.reportsTag }}"
        {{- else if eq $service.app "reports-jobs" }}
        image: "{{ $.Values.image.reportsRepo }}/boldreports-server-jobs:{{ $.Values.image.reportsTag }}"
        {{- else if eq $service.app "reports-reportservice" }}
        image: "{{ $.Values.image.reportsRepo }}/boldreports-designer:{{ $.Values.image.reportsTag }}"
        {{- else if eq $service.app "reports-viewer" }}
        image: "{{ $.Values.image.reportsRepo }}/boldreports-viewer:{{ $.Values.image.reportsTag }}"
        {{- else if eq $service.app "bold-etl" }}
        image: "{{ $.Values.image.reportsRepo }}/bold-etl:{{ $.Values.image.reportsTag }}"
        {{- else if eq $service.app "reports-ai" }}
        image: "{{ $.Values.image.reportsRepo }}/boldreports-ai:{{ $.Values.image.reportsTag }}"
        {{- else if eq $service.app "reports-mcp" }}
        image: "{{ $.Values.image.reportsRepo }}/boldreports-mcp-server:{{ $.Values.image.reportsTag }}"
        {{- end }}
        imagePullPolicy: {{ $.Values.image.pullPolicy | default "Always" }}
        {{- with ($service.containerSecurityContext | default $.Values.containerSecurityContext) }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with ($service.lifecycle | default $.Values.lifecycle) }}
        lifecycle:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: {{ $service.cpuResourceRequests }}
            memory: {{ $service.memoryResourceRequests }}
          {{- if or $service.cpuResourceLimits $service.memoryResourceLimits }}
          limits:
            {{- with $service.cpuResourceLimits }}
            cpu: {{ . }}
            {{- end }}
            {{- with $service.memoryResourceLimits }}
            memory: {{ . }}
            {{- end }}
          {{- end }}
        env:
        - name: BOLD_SERVICES_HOSTING_ENVIRONMENT
          value: k8s
        {{- if $hasRealPV }}
        - name: BOLD_SERVICES_PV_USED
          value: "true"
        {{- else }}
        - name: BOLD_SERVICES_PV_USED
          value: "false"
        {{- end }}
        {{- if and (hasKey $.Values "ociStorage") (hasKey $.Values.ociStorage "enabled") ( $.Values.ociStorage.enabled | default false ) }}
        - name: BOLD_SERVICES_OCI_ACCESS_KEY
          value: "{{ $.Values.ociStorage.accessKey | default "" }}"
        - name: OCI_ACCESS_KEY
          value: "{{ $.Values.ociStorage.accessKey | default "" }}"
        - name: BOLD_SERVICES_OCI_BUCKET_NAME
          value: "{{ $.Values.ociStorage.bucketName | default "" }}"
        - name: BOLD_SERVICES_OCI_NAME_SPACE
          value: "{{ $.Values.ociStorage.namespace | default "" }}"
        - name: BOLD_SERVICES_OCI_REGION
          value: "{{ $.Values.ociStorage.region | default "" }}"
        - name: OCI_REGION
          value: "{{ $.Values.ociStorage.region | default "" }}"
        - name: BOLD_SERVICES_OCI_ROOTFOLDER_NAME
          value: "{{ $.Values.ociStorage.rootFolderName | default "" }}"
        - name: BOLD_SERVICES_OCI_SECRET_KEY
          value: "{{ $.Values.ociStorage.secretKey | default "" }}"
        - name: OCI_SECRET_KEY
          value: "{{ $.Values.ociStorage.secretKey | default "" }}"
        - name: BOLD_SERVICES_STORAGETYPE
          value: "{{ $.Values.ociStorage.storageType | default "" }}"
        {{- end }}
        {{- if and (hasKey $.Values "s3Storage") (hasKey $.Values.s3Storage "enabled") ( $.Values.s3Storage.enabled | default false ) }}
        - name: BOLD_SERVICES_AWS_ACCESS_KEY_ID
          value: "{{ $.Values.s3Storage.accessKey | default "" }}"
        - name: BOLD_SERVICES_AMAZON_BUCKET_NAME
          value: "{{ $.Values.s3Storage.bucketName | default "" }}"
        - name: BOLD_SERVICES_AWS_REGION
          value: "{{ $.Values.s3Storage.region | default "" }}"
        - name: BOLD_SERVICES_AMAZON_ROOTFOLDER_NAME
          value: "{{ $.Values.s3Storage.rootFolderName | default "" }}"
        - name: BOLD_SERVICES_AWS_SECRET_ACCESS_KEY
          value: "{{ $.Values.s3Storage.secretKey | default "" }}"
        - name: BOLD_SERVICES_STORAGETYPE
          value: "{{ $.Values.s3Storage.storageType | default "" }}"
        {{- end }}
        {{- if and (hasKey $.Values "azureStorage") (hasKey $.Values.azureStorage "enabled") ( $.Values.azureStorage.enabled | default false ) }}
        - name: BOLD_SERVICES_AZUREBLOB_ACCESSKEY
          value: "{{ $.Values.azureStorage.accessKey | default "" }}"
        - name: BOLD_SERVICES_AZUREBLOB_ACCOUNT_NAME
          value: "{{ $.Values.azureStorage.accountName | default "" }}"
        - name: BOLD_SERVICES_AZUREBLOB_CONTAINER_NAME
          value: "{{ $.Values.azureStorage.containerName | default "" }}"
        - name: BOLD_SERVICES_AZUREBLOB_CONNECTION_TYPE
          value: "{{ $.Values.azureStorage.connectionType | default "" }}"
        - name: BOLD_SERVICES_AZUREBLOB_STORAGE_URI
          value: "{{ $.Values.azureStorage.storageUri | default "" }}"
        - name: BOLD_SERVICES_STORAGETYPE
          value: "{{ $.Values.azureStorage.storageType | default "" }}"
        {{- end }}
        - name: APP_BASE_URL
          value: {{ $.Values.appBaseUrl }}
        {{- if $.Values.optionalLibs }}
        - name: INSTALL_OPTIONAL_LIBS
          value: {{ $.Values.optionalLibs }}
        {{- end }}
        {{- if eq $service.app "id-ums" }}
        - name: BOLD_SERVICES_USE_SITE_IDENTIFIER
          value: "true"
        - name: BOLD_SERVICES_UPGRADE_CENTER_ENABLE
          value: "{{ $.Values.upgradeCenter.enabled | default "false" }}"
        {{- end }}
        {{- /* Global extraEnv first, then per-service env, so a service can override a global value. */}}
        {{- with (concat ($.Values.extraEnv | default list) ($service.env | default list)) }}
        {{- include "boldreports.envList" . | nindent 8 }}
        {{- end }}
        {{- $extraEnvFrom := concat ($.Values.extraEnvFrom | default list) ($service.envFrom | default list) }}
        {{- if or (eq $service.app "id-ums") $extraEnvFrom }}
        envFrom:
        {{- if eq $service.app "id-ums" }}
        - secretRef:
              name: bold-user-secret
        - secretRef:
              name: bold-db-secret
        - secretRef:
              name: bold-license-key
        - configMapRef:
              name: branding-config
              optional: true
        {{- end }}
        {{- with $extraEnvFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- $readiness := $service.readinessProbe | default $.Values.readinessProbe | default dict }}
        readinessProbe:
          httpGet:
            path: /health-check
            port: 80
          initialDelaySeconds: {{ $readiness.initialDelaySeconds | default 60 }}
          periodSeconds: {{ $readiness.periodSeconds | default 10 }}
          timeoutSeconds: {{ $readiness.timeoutSeconds | default 10 }}
          {{- with $readiness.failureThreshold }}
          failureThreshold: {{ . }}
          {{- end }}
        {{- /* Per-service probe keys are merged over the global probe, so a service can change one
               setting without repeating the handler. `enabled` is resolved separately because
               merging ignores false values. */}}
        {{- range $probeName := list "livenessProbe" "startupProbe" }}
        {{- $globalProbe := index $.Values $probeName | default dict }}
        {{- $serviceProbe := index $service $probeName | default dict }}
        {{- $enabled := ternary $serviceProbe.enabled $globalProbe.enabled (hasKey $serviceProbe "enabled") }}
        {{- if $enabled }}
        {{ $probeName }}:
          {{- toYaml (omit (mergeOverwrite (deepCopy $globalProbe) $serviceProbe) "enabled") | nindent 10 }}
        {{- end }}
        {{- end }}
        volumeMounts:
        {{- with (concat ($.Values.extraVolumeMounts | default list) ($service.extraVolumeMounts | default list)) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $hasRealPV }}
        - mountPath: /application/app_data
          name: {{ $service.app }}-volume
        {{- end }}
        {{- if eq $service.app "id-web" }}
        - mountPath: /application/idp/web/logs/k8s
        {{- else if eq $service.app "id-api" }}
        - mountPath: /application/idp/api/logs/k8s
        {{- else if eq $service.app "id-ums" }}
        - mountPath: /application/idp/ums/logs/k8s
        {{- else if eq $service.app "reports-web" }}
        - mountPath: /application/reporting/web/logs
        {{- else if eq $service.app "reports-api" }}
        - mountPath: /application/reporting/api/logs
        {{- else if eq $service.app "reports-jobs" }}
        - mountPath: /application/reporting/jobs/logs
        {{- else if eq $service.app "reports-reportservice" }}
        - mountPath: /application/reporting/reportservice/logs
        {{- else if eq $service.app "reports-viewer" }}
        - mountPath: /application/reporting/viewer/logs
        {{- else if eq $service.app "bold-etl" }}
        - mountPath: /application/etl/etlservice/logs/k8s
        {{- else if eq $service.app "reports-ai" }}
        - mountPath: /application/reporting/ai/logs
        {{- else if eq $service.app "reports-mcp" }}
        - mountPath: /application/reporting/mcp/logs
        {{- end }}
          name: log4net-config-volume
      volumes:
      {{- if $hasRealPV }}
      - name: {{ $service.app }}-volume
        persistentVolumeClaim:
          {{- if $.Values.persistentVolume.useExistingClaim }}
          claimName: {{ $.Values.persistentVolume.claimName }}
          {{- else }}
          claimName: {{ $.Values.persistentVolume.name }}-claim
          {{- end }}
          readOnly: false
      {{- end }}
      - name: log4net-config-volume
        configMap:
          name: log4net-config
      {{- with (concat ($.Values.extraVolumes | default list) ($service.extraVolumes | default list)) }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- $serviceTolerations := $service.tolerations | default list }}
      {{- if or $.Values.tolerationEnable $serviceTolerations }}
      tolerations:
        {{- if $.Values.tolerationEnable }}
        {{- range $.Values.tolerations }}
        - key: "{{ .key }}"
          operator: "{{ .operator }}"
          {{- if .value }}
          value: "{{ .value }}"
          {{- end }}
          effect: "{{ .effect }}"
        {{- end }}
        {{- end }}
        {{- with $serviceTolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- /* A raw affinity block (per service, else global) replaces the *AffinityEnable toggles below. */}}
      {{- with ($service.affinity | default $.Values.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      {{- if or $.Values.nodeAffinityEnable $.Values.podAffinityEnable $.Values.podAntiAffinityEnable}}
      affinity:
        {{- if $.Values.nodeAffinityEnable }}
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              {{- if $.Values.nodeAffinity.matchExpressions }}
              {{- toYaml $.Values.nodeAffinity.matchExpressions | nindent 14 }}
              {{- else }}
              - key: "{{ $.Values.nodeAffinity.key }}"
                operator: "{{ $.Values.nodeAffinity.operator }}"
                values:
                - "{{ $.Values.nodeAffinity.value }}"
              {{- end }}
        {{- end }}
        {{- if $.Values.podAffinityEnable }}
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: "app.kubernetes.io/name" 
                operator: "In"
                values:
                - "{{ $service.app }}"
            topologyKey: "kubernetes.io/hostname"
        {{- end }}
        {{- if $.Values.podAntiAffinityEnable }}
        podAntiAffinity:
          {{- if eq ($.Values.podAntiAffinityType | default "required") "preferred" }}
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: "app.kubernetes.io/name"
                  operator: "In"
                  values:
                  - "{{ $service.app }}"
              topologyKey: "kubernetes.io/hostname"
          {{- else }}
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: "app.kubernetes.io/name"
                operator: "In"
                values:
                - "{{ $service.app }}"
            topologyKey: "kubernetes.io/hostname"
          {{- end }}
        {{- end }}
      {{- end }}
      {{- end }}
---
{{- end }}
