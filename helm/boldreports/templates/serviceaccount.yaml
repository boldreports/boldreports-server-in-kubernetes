{{- if and .Values.serviceAccount .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    {{- include "boldreports.labels" . | nindent 4 }}
  name: {{ include "boldreports.podServiceAccountName" . }}
{{ include "boldreports.namespace" . | indent 2 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if hasKey .Values.serviceAccount "automountServiceAccountToken" }}
{{- if not (kindIs "invalid" .Values.serviceAccount.automountServiceAccountToken) }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- end }}
{{- end }}
