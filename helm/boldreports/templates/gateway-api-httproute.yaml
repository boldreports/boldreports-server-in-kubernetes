{{- /*
Generic Gateway API HTTPRoute for any conformant implementation (Envoy Gateway, Istio, Cilium,
NGINX Gateway Fabric, AWS/GKE gateways, ...). Rules are rendered only for services present in
instanceConfig. Gateway API matches the longest PathPrefix, so rule order does not matter.
*/}}
{{- if and .Values.gatewayApi .Values.gatewayApi.enabled }}
{{- $gw := .Values.gatewayApi }}
{{- $apps := list }}
{{- range .Values.instanceConfig }}{{ $apps = append $apps .app }}{{ end }}
{{- $routes := list
  (dict "path" "/reporting/api" "app" "reports-api")
  (dict "path" "/reporting/jobs" "app" "reports-jobs")
  (dict "path" "/reporting/reportservice" "app" "reports-reportservice")
  (dict "path" "/reporting/viewer" "app" "reports-viewer")
  (dict "path" "/reporting/ai" "app" "reports-ai")
  (dict "path" "/reportsai" "app" "reports-ai")
  (dict "path" "/reporting/mcp" "app" "reports-mcp")
  (dict "path" "/reportsmcp" "app" "reports-mcp")
  (dict "path" "/reporting" "app" "reports-web")
  (dict "path" "/api" "app" "id-api")
  (dict "path" "/ums" "app" "id-ums")
  (dict "path" "/etlservice" "app" "bold-etl" "rewrite" true)
  (dict "path" "/" "app" "id-web")
}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    {{- include "boldreports.labels" . | nindent 4 }}
    {{- with $gw.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  name: {{ $gw.name | default "bold-reports" }}
{{ include "boldreports.namespace" . | indent 2 }}
  {{- with $gw.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not $gw.parentRefs }}
  {{- fail "gatewayApi.parentRefs is required when gatewayApi.enabled is true" }}
  {{- end }}
  parentRefs:
    {{- toYaml $gw.parentRefs | nindent 4 }}
  {{- if $gw.hostnames }}
  hostnames:
    {{- toYaml $gw.hostnames | nindent 4 }}
  {{- else if or (hasPrefix "https://" .Values.appBaseUrl) (hasPrefix "http://" .Values.appBaseUrl) }}
  hostnames:
  - {{ index (splitList "/" .Values.appBaseUrl) 2 | quote }}
  {{- end }}
  rules:
  {{- range $routes }}
  {{- if has .app $apps }}
  {{- $timeouts := index ($gw.serviceTimeouts | default dict) .app | default $gw.timeouts }}
  - matches:
    - path:
        type: PathPrefix
        value: {{ .path }}
    {{- if .rewrite }}
    # bold-etl serves from /, so strip the prefix (otherwise it renders <base href="/etlservice/etlservice/">)
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    {{- end }}
    {{- with $timeouts }}
    timeouts:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    backendRefs:
    - name: {{ .app }}-service
      port: {{ include "boldreports.servicePort" .app }}
  {{- end }}
  {{- end }}
  {{- with $gw.extraRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
