# Default values for bold-services.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
namespace: bold-services
appBaseUrl: ''
optionalLibs: ''
clusterProvider: ''

persistentVolume:
  # persistent volumes were global resources. 
  # so if you already have Bold Reports installed in your cluster, then the previous persistent volume name will conflict with current installation.
  # Change this name to avoid conflicts with previous Bold Reports persistent volumes.
  name: bold-services-fileserver
  capacity: 3Gi
  # Set to false when the cluster already provides the StorageClass (e.g. efs-sc). The chart's
  # StorageClass is cluster-scoped, so uninstalling the release would delete it for every workload.
  createStorageClass: true
  # Add helm.sh/resource-policy: keep to the StorageClass, PersistentVolume and claim so that
  # uninstalling the release (or a GitOps prune) doesn't remove the shared storage.
  keep: false
  gke:
    fileShareName: ''
    fileShareIp: ''
  eks:
    efsFileSystemId: ''
  ack:  
    serverName: ''
    filePath: ''
  aks:
    fileShareName: ''
    # base64 string
    azureStorageAccountName: ''
    # base64 string
    azureStorageAccountKey: ''
    nfs:
      # fileshare name as 'storageaccountname/filesharename' Ex:premiumstorage1234/boldreports.
      fileShareName: ''

      # hostname of the fileshare Ex:premiumstorage1234.file.core.windows.net.
      hostName: ''

    # When using AKS workload identity or a user-assigned managed identity,
    # provide the following values. The identity must have the
    # "Storage Account Key Operator Service Role" (or equivalent) role on storage account.
    
    managedIdentity:
      # Name of the Azure Files share (no path)
      fileShareName: ''

      # Name of the storage account (not base64)
      azureStorageAccountName: ''

      # Resource group that contains the storage account
      resourceGroup: ''
      
      # Azure subscription ID that contains the storage account
      subscriptionId: ''
      
  onpremise:
    hostPath: ''

  useExistingClaim: false
  claimName: ''

# Object-storage alternatives to the product filesystem PVC.
s3Storage:
  enabled: false
  bucketName: ''
  region: ''
  rootFolderName: ''
  accessKey: ''
  secretKey: ''
  storageType: 3

azureStorage:
  enabled: false
  accountName: ''
  containerName: ''
  connectionType: Https
  storageUri: ''
  accessKey: ''
  storageType: 1

# For OCI configuration, set enabled as true.
ociStorage:
  # Enable OCI storage backend (required: set to true to use OCI)
  enabled: false
  # OCI access key for authentication (e.g., your OCI user access key)
  accessKey:
  # Name of the OCI bucket to use for storage
  bucketName:
  # OCI namespace (tenant OCID or namespace name)
  namespace:
  # OCI region where the bucket is located (e.g., us-ashburn-1)
  region:
  # Root folder path within the bucket for storing data
  rootFolderName:
  # OCI secret key for authentication (e.g., your OCI user secret key)
  secretKey: 
  # Type of OCI storage
  storageType: 4

image:
  idRepo: syncfusion
  reportsRepo: syncfusion
  # Overrides the image tag whose default is the chart appVersion.
  idTag: 15.1.10
  reportsTag: 15.1.10
  # Applied to all Bold service containers. (The 15.1.10 template hard-coded Always and
  # ignored this value; Always keeps that behaviour.)
  pullPolicy: Always
imagePullSecrets: []


loadBalancer:
  type: traefik
  # ingressClassName: traefik
  # gatewayName: 
  # gatewayNamespace: 
  affinityCookie:
    enable: true
    affinityCookieExpiration: 600
  # For Kubernetes >= 1.18 you should specify the ingress-controller via the field ingressClassName
  # See https://kubernetes.io/blog/2020/04/02/improvements-to-the-ingress-api-in-kubernetes-1.18/#specifying-the-class-of-an-ingress
  
  nginxIngressAnnotations:
    # Enter annotations here for adding annotations in nginx ingress
    # Example:
    #cert-manager.io/cluster-issuer: letsencrypt-prod
    #nginx.ingress.kubernetes.io/rewrite-target: /

  singleHost: 
    secretName: bold-tls
  # multipleHost:
    # hostArray:
      # - hosts: 
          # - kubernetes.docker.internal
          # - example.com
        # secretName: bold-tls
        
subApplication:
  enabled: false
  # Specify the subpath. The default subpath value is 'boldservices'
  subPath: ''

logging:
 level: "both"      # info | error | both
 output: "file"  # console | file | both 

