service:
  type: ClusterIP
  port: 80
  
autoscaling:
  enabled: true
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
  behavior:
    stabilizationWindowSeconds: 60
    podsValue: 1
    podsPeriodSeconds: 60
    percentValue: 10
    percentPeriodSeconds: 60
    # Optional HorizontalPodAutoscaler scaleUp behavior (rendered as-is), e.g.
    #   scaleUp:
    #     stabilizationWindowSeconds: 0
    #     policies:
    #       - type: Pods
    #         value: 2
    #         periodSeconds: 60
    scaleUp: {}
  # Per service, instanceConfig[].targetCPUUtilizationPercentage / targetMemoryUtilizationPercentage
  # override the targets above; 0 or null drops that metric for the service. Memory-based scaling
  # rarely scales back down for .NET services, which keep memory they have allocated.

# Set existingSecret: true if you manage the "bold-secret" Secret (Bing Maps and Application
# Insights settings) outside the chart.
boldSecret:
  existingSecret: false

bingMapWidget:
  enabled: false
  apiKey: ''

azureApplicationInsights:
  connectionString: ""

rootUserDetails:
  # Set this to true if you have existing details in your cluster.
  existingSecret: false
  email: ""
  password: ""

databaseServerDetails:
  # Set this to true if you have existing details in your cluster.
  existingSecret: false

  # Type of database server can be used for configuring the Bold BI. Eg: mssql, mysql and postgresql
  dbType: ""

  # Name of the Database Server
  dbHost: ""

  # The system will use the following default port numbers based on the database server type.
  # PostgrSQL – 5432 and MySQL -3306
  # Please specify the port number for your database server if it is configured on a different port.
  # For MS SQL Server, this parameter is not necessary.
  dbPort: ""

  # Username for the database server
  # Please refer to this documentation for information on the user's permissions.
  # https://help.boldbi.com/embedded-bi/faq/what-are-the-database-permissions-required-to-set-up-bold-bi-embedded/
  dbUser: ""

  # The database user's password
  dbPassword: ""

  # If the database name is not specified, the system will create a new database called bold services.
  # If you specify a database name, it should already exist on the server.
  dbName: ""

  # For PostgreSQL DB Servers, this is an optional parameter.
  # The system will use the database name postgresql by default.
  # If your database server uses a different default database, please provide it here.
  maintenanceDB: ""
  
  # If your database server requires additional connection string parameters, include them here
  # Connection string parameters can be found in the official document.
  # My SQL: https://dev.mysql.com/doc/connector-net/en/connector-net-8-0-connection-options.html
  # PostgreSQL: https://www.npgsql.org/doc/connection-string-parameters.html
  # MS SQL: https://docs.microsoft.com/en-us/dotnet/api/system.data.sqlclient.sqlconnection.connectionstring
  # Note: A semicolon(;) should be used to separate multiple parameters.
  dbAdditionalParameters: ""
  
  #A database schema defines the structure, organization, and constraints of data within a database, including tables, fields, relationships, and indexes.
  #In MSSQL, the default schema is dbo.
  #In PostgreSQL, the default schema is public.
  #Both schemas contain tables and other database objects by default.
  dbSchema: ""
 
brandingDetails:

  main_logo:  ""
  
  login_logo:  ""
  
  email_logo:  ""
  
  favicon:  ""
  
  footer_logo:  ""
  
  site_name: ""
  
  site_identifier: ""
  
  
licenseKeyDetails:
  # Set this to true if you have existing details in your cluster.
  existingSecret: false
  
  # The Bold Reports licnece key which you have purchesed.
  licenseKey: ""

## Upgrade Center Configuration for Bold Reports
upgradeCenter:
  # Set this to true to deploy the Upgrade Center service for Bold Reports. Set it to false to skip Upgrade Center resources.
  enabled: false
  # IdpIntegrated preserves existing SSO; Standalone uses product storage and local login.
  integrationMode: IdpIntegrated
  # Root User administrator credentials used by Upgrade Center validation jobs.
  # 
  # Credentials provided under rootUserDetails take priority. These values are used only when rootUserDetails is empty.
  secret:
    adminUsername: ""
    adminPassword: ""

  # Upgrade Center web application image.
  image:
    repo: docker.io/syncfusion/bold-upgrade-center
    tag: 1.0.0
    pullPolicy: Always

  # CPU and memory requests/limits for the Upgrade Center web application pod.
  # Increase these values if large history, log, report, or Kubernetes monitoring workloads are expected.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1536Mi
      
# Tolerations allow the pods to be scheduled into nodes with matching taints.
# Set this to true if you use tolerations in your cluster.
# If you need more than one toleration, you can add tolerations below.
tolerationEnable: false 
tolerations:
  - key: ""
    operator: ""
    value: ""
    effect: ""

# Node affinity ensures that the pods are scheduled into nodes with matching labels.
# Set this to true if you use Node affinity in your cluster.
nodeAffinityEnable: false
nodeAffinity:
  key: "app"
  operator: "In"
  value: "boldreports"

# Pod affinity ensures that the pods are scheduled into nodes with matching pods.
# Set this to true if you use pod Affinity in your cluster.
podAffinityEnable: false

# Pod anti-affinity ensures that the pods are not scheduled into nodes with matching pods.
# Set this to true if you use pod AntiAffinity in your cluster.
podAntiAffinityEnable: false

# Set to "preferred" to spread replicas across nodes on a best-effort basis instead of
# refusing to schedule when no other node is free (only used with podAntiAffinityEnable: true).
podAntiAffinityType: required

# ---------------------------------------------------------------------------------------
# Pod customisation. All settings below are optional and empty by default, so the rendered
# manifests are unchanged unless you set them. Unless stated otherwise each setting can be
# given globally here and overridden per service under instanceConfig[] with the same key.
# ---------------------------------------------------------------------------------------

# Extra pod annotations / labels, e.g. karpenter.sh/do-not-disrupt, Datadog/Prometheus tags.
# Per-service values are merged over the global ones.
podAnnotations: {}
podLabels: {}

# Extra environment variables for the main container, e.g. .NET runtime tuning:
#   - name: DOTNET_gcServer
#     value: "0"
#   - name: DOTNET_GCHeapHardLimitPercent
#     value: "0x46"          # 70% of the container memory limit (hex)
# Global entries are rendered first, then instanceConfig[].env (so a service can override).
extraEnv: []
# Extra envFrom sources (secretRef / configMapRef) for every service; per service: envFrom.
extraEnvFrom: []

# Extra volumes / mounts, e.g. custom fonts or a writable /tmp with readOnlyRootFilesystem.
# Global and per-service (extraVolumes / extraVolumeMounts) lists are concatenated.
extraVolumes: []
extraVolumeMounts: []

# Pod and container securityContext (container settings also apply to the init container).
# Example for Pod Security Standards "restricted" (verify the images support it first):
#   podSecurityContext:
#     runAsNonRoot: true
#     seccompProfile:
#       type: RuntimeDefault
#   containerSecurityContext:
#     allowPrivilegeEscalation: false
#     capabilities:
#       drop: ["ALL"]
podSecurityContext: {}
containerSecurityContext: {}

# Resources for the id-web-initialization init container (otherwise namespace defaults apply).
initContainerResources: {}

# Raw affinity block. When set (globally or per service) it replaces nodeAffinityEnable /
# podAffinityEnable / podAntiAffinityEnable for that pod.
affinity: {}
# nodeAffinity (above) also accepts a list of expressions instead of key/operator/value:
#   nodeAffinity:
#     matchExpressions:
#       - key: karpenter.sh/capacity-type
#         operator: In
#         values: ["on-demand"]
#       - key: kubernetes.io/arch
#         operator: In
#         values: ["amd64"]

nodeSelector: {}

# Spread replicas across nodes/zones. labelSelector defaults to the service's own pods.
#   topologySpreadConstraints:
#     - maxSkew: 1
#       topologyKey: kubernetes.io/hostname
#       whenUnsatisfiable: ScheduleAnyway
topologySpreadConstraints: []

priorityClassName: ""
# Seconds to let in-flight requests (exports, report rendering) finish on shutdown.
terminationGracePeriodSeconds:

# PodDisruptionBudget per service, protecting in-flight work from voluntary evictions
# (node drains, cluster-autoscaler / Karpenter consolidation). Per service override:
#   instanceConfig:
#     - app: reports-api
#       podDisruptionBudget:
#         enabled: true
#         maxUnavailable: 0
podDisruptionBudget:
  enabled: false
  maxUnavailable: 1

# Readiness probe timings (the probe itself is always rendered, as before).
readinessProbe:
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 10

# Optional liveness / startup probes (disabled by default). Per-service probe settings are
# merged over these, so a service can change one value (or set enabled: false) without
# repeating the handler.
livenessProbe:
  enabled: false
  httpGet:
    path: /health-check
    port: 80
  initialDelaySeconds: 120
  periodSeconds: 20
  timeoutSeconds: 10
  failureThreshold: 6
startupProbe:
  enabled: false
  httpGet:
    path: /health-check
    port: 80
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 60

# Additional per-service keys accepted under instanceConfig[]:
#   cpuResourceLimits / memoryResourceLimits  rendered as resources.limits when set
#   hpaEnabled: false                         skip the HPA and use replicaCount for this service
#   tolerations: [...]                        appended to the global tolerations
#   podAnnotations, podLabels, env, envFrom, extraVolumes, extraVolumeMounts,
#   podSecurityContext, containerSecurityContext, affinity, nodeSelector,
#   topologySpreadConstraints, priorityClassName, terminationGracePeriodSeconds,
#   podDisruptionBudget, readinessProbe, livenessProbe, startupProbe, lifecycle, strategy,
#   revisionHistoryLimit, targetCPUUtilizationPercentage, targetMemoryUtilizationPercentage

# ServiceAccount for the Bold service pods. By default no serviceAccountName is set and pods use
# the namespace's "default" ServiceAccount; workload identity (IRSA, GKE / Azure workload
# identity) then has to be granted to every pod in the namespace. Create a dedicated one instead:
#   serviceAccount:
#     create: true
#     annotations:
#       eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/<bold-reports-role>
serviceAccount:
  create: false
  # Name to create, or an existing ServiceAccount to use when create is false. Defaults to "bold-reports".
  name: ""
  annotations: {}
  # true / false to set automountServiceAccountToken on the ServiceAccount and pods; null leaves it unset.
  automountServiceAccountToken:

# Roll the pods when the log4net or branding ConfigMaps change (adds checksum annotations).
# The checksums include the chart's version labels, so pods also roll on every chart upgrade.
rollOnConfigChange: false

# Deployment rollout settings (global, or per service under instanceConfig[]).
#   strategy:
#     type: RollingUpdate
#     rollingUpdate:
#       maxSurge: 1
#       maxUnavailable: 0
strategy: {}
revisionHistoryLimit:

# Container lifecycle hooks (global, or per service). A short preStop sleep lets load balancers
# and gateways stop sending traffic before the container exits:
#   lifecycle:
#     preStop:
#       exec:
#         command: ["sh", "-c", "sleep 10"]
lifecycle: {}

# Gateway API HTTPRoute for any conformant implementation (Envoy Gateway, Istio, Cilium, NGINX
# Gateway Fabric, cloud gateways). Routes the standard Bold paths to the services listed in
# instanceConfig. Set loadBalancer.type: none when using it, otherwise the default traefik
# routes are rendered as well. Session affinity for reports-viewer (needed for exports with more
# than one replica) must be configured with your implementation's policy, e.g. an Envoy Gateway
# BackendTrafficPolicy with consistentHash type Cookie. `timeouts` needs Gateway API v1.2+ CRDs.
gatewayApi:
  enabled: false
  name: bold-reports
  # Required: the Gateway listener(s) to attach to.
  #   parentRefs:
  #     - name: my-gateway
  #       namespace: gateway-system
  #       sectionName: https
  parentRefs: []
  # Defaults to the host in appBaseUrl.
  hostnames: []
  annotations: {}
  labels: {}
  # Default timeouts for every rule (HTTPRouteTimeouts), e.g. {request: 300s}
  timeouts: {}
  # Per-service overrides keyed by app name, e.g.
  #   serviceTimeouts:
  #     reports-viewer:
  #       request: 600s
  serviceTimeouts: {}
  # Additional HTTPRoute rules appended as-is.
  extraRules: []
