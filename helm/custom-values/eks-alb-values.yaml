# Default values for boldreports.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
namespace: bold-services
appBaseUrl: ''
optionalLibs: 'mysql,oracle,postgresql,snowflake'
clusterProvider: 'eks'

persistentVolume:
  # persistent volumes were global resources. 
  # so if you already have Bold Reports installed in your cluster, then the previous persistent volume name will conflict with current installation.
  # Change this name to avoid conflicts with previous Bold Reports persistent volumes.
  name: bold-fileserver
  capacity: 3Gi
  eks:
    efsFileSystemId: ''
    efsAccessPointId: ''

    # storageClass were global resources.
    # so if you already have Bold BI installed in your cluster, then the previous storage class name will conflict with current installation.
    # Change this name to avoid conflicts with previous Bold BI StorageClass. The default value is 'efs-sc'
    storageClass: 'efs-sc'

# For OCI configuration, set enabled as true.
ociStorage:
  # Enable OCI storage backend (required: set to true to use OCI)
  enabled: false
  # OCI access key for authentication (e.g., your OCI user access key)
  accessKey:
  # Name of the OCI bucket to use for storage
  bucketName:
  # OCI namespace (tenant OCID or namespace name)
  namespace:
  # OCI region where the bucket is located (e.g., us-ashburn-1)
  region:
  # Root folder path within the bucket for storing data
  rootFolderName:
  # OCI secret key for authentication (e.g., your OCI user secret key)
  secretKey: 
  # Type of OCI storage
  storageType: 4

image:
  idRepo: us-docker.pkg.dev/boldreports/multi-container
  reportsRepo: us-docker.pkg.dev/boldreports/multi-container
  # Overrides the image tag whose default is the chart appVersion.
  idTag: 14.1.18
  reportsTag: 14.1.18
  pullPolicy: IfNotPresent
imagePullSecrets: []

versions:
  idp: "5.1.1"
  reports: "14.1.18"

loadBalancer:
  type: alb
  groupName: 'bold-services'
  affinityCookie:
    enable: true
    affinityCookieExpiration: 600 
  ssl:
    enable: true
    tls: arn
    arn: ''

# To change the ALB Ingress type or routing method, update the scheme or targetType below
  scheme: internet-facing
  targetType: ip

  nginxIngressAnnotations:
    # Enter annotations here for adding annotations in nginx ingress
    # Example:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/rewrite-target: /
  albIngressAnnotations:
    # Enter annotations here for adding annotations in ALB ingress
    # Example:
    # alb.ingress.kubernetes.io/subnets: 

  singleHost: 
    secretName: bold-tls

instanceConfig:
  - app: id-web
    product: boldid
    replicaCount: 1
    minReplicas: 1
    maxReplicas: 20
    cpuResourceRequests: 250m
    memoryResourceRequests: 750Mi
  - app: id-api
    product: boldid
    replicaCount: 1
    minReplicas: 1
    maxReplicas: 20
    cpuResourceRequests: 250m
    memoryResourceRequests: 750Mi
  - app: id-ums
    product: boldid
    replicaCount: 1
    minReplicas: 1
    maxReplicas: 20
    cpuResourceRequests: 250m
    memoryResourceRequests: 750Mi
  - app: reports-web
    product: boldreports
    replicaCount: 1
    minReplicas: 1
    maxReplicas: 20
    cpuResourceRequests: 250m
    memoryResourceRequests: 750Mi
  - app: reports-api
    product: boldreports
    replicaCount: 1
    minReplicas: 1
    maxReplicas: 20
    cpuResourceRequests: 250m
    memoryResourceRequests: 750Mi
  - app: reports-jobs
    product: boldreports
    replicaCount: 1
    minReplicas: 1
    maxReplicas: 1
    cpuResourceRequests: 250m
    memoryResourceRequests: 750Mi
  - app: reports-viewer
    product: boldreports
    replicaCount: 1
    minReplicas: 1
    maxReplicas: 20
    cpuResourceRequests: 250m
    memoryResourceRequests: 750Mi
  - app: reports-reportservice
    product: boldreports
    replicaCount: 1
    minReplicas: 1
    maxReplicas: 1
    cpuResourceRequests: 250m
    memoryResourceRequests: 750Mi
  - app: bold-etl
    product: boldreports
    replicaCount: 1
    minReplicas: 1
    maxReplicas: 20
    cpuResourceRequests: 250m
    memoryResourceRequests: 750Mi
    
service:
  type: ClusterIP
  port: 80
  
autoscaling:
  enabled: true
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
  behavior:
    stabilizationWindowSeconds: 60
    podsValue: 1
    podsPeriodSeconds: 60
    percentValue: 10
    percentPeriodSeconds: 60

## Upgrade Center Configuration for Bold Reports
upgradeCenter:
  # Set this to true to deploy the Upgrade Center service for Bold Reports. Set it to false to skip Upgrade Center resources.
  enabled: false
  # Root User administrator credentials used by Upgrade Center validation jobs.
  # 
  # Credentials provided under rootUserDetails take priority. These values are used only when rootUserDetails is empty.
  secret:
    adminUsername: ""
    adminPassword: ""

  # Upgrade Center web application image.
  image:
    repo: docker.io/syncfusion/bold-upgrade-center
    tag: 1.0.0
    pullPolicy: Always

  # CPU and memory requests/limits for the Upgrade Center web application pod.
  # Increase these values if large history, log, report, or Kubernetes monitoring workloads are expected.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1536Mi

# Tolerations allow the pods to be scheduled into nodes with matching taints.
# Set this to true if you use tolerations in your cluster.
# If you need more than one toleration, you can add tolerations below.
tolerationEnable: false 
tolerations:
  - key: ""
    operator: ""
    value: ""
    effect: ""

# Node affinity ensures that the pods are scheduled into nodes with matching labels.
# Set this to true if you use Node affinity in your cluster.
nodeAffinityEnable: false
nodeAffinity:
  key: ""
  operator: ""
  value: ""

# Pod affinity ensures that the pods are scheduled into nodes with matching pods.
# Set this to true if you use pod Affinity in your cluster.
podAffinityEnable: false

# Pod anti-affinity ensures that the pods are not scheduled into nodes with matching pods.
# Set this to true if you use pod AntiAffinity in your cluster.
podAntiAffinityEnable: false    
